en:
  theme_metadata:
    description: "Adds an accessible 'Listen' button to posts using the browser's built-in text-to-speech (Web Speech API). No external services, no API keys."
    settings:
      default_rate: "Default playback speed (1 = normal)."
      default_voice: "Preferred voice language, chosen from the list (e.g. 'de' or 'de-DE'). 'auto' follows the platform's default language when no matching voice exists."
      fallback_voice: "Second-choice voice language, used when the default language has no matching voice on the visitor's device."
      show_voice_selector: "Let users pick from the voices installed on their device."
      skip_code_blocks: "Don't read code blocks aloud."
      skip_quotes: "Don't read quoted content aloud."
      show_unsupported_notice: "Show a short notice on posts when the visitor's browser has no text-to-speech support (otherwise the button is simply hidden)."
      show_no_voice_notice: "Show a small red notice when no installed voice speaks the configured language, and let the visitor pick one from the drop-down (otherwise the player just stays idle)."
  tts_listen:
    group_label: "Listen to this post"
    listen: "Listen"
    pause: "Pause"
    resume: "Resume"
    stop: "Stop"
    speed: "Speed"
    default_speed: "Default"
    voice: "Voice"
    default_voice_option: "Default (admin)"
    unsupported: "Text-to-speech isn't supported by this browser."
    playing: "Reading post aloud…"
    paused: "Paused"
    finished: "Finished reading"
    failed: "Text-to-speech failed."
    empty: "Nothing readable in this post."
    no_voice: "No voice for %{language} is installed on this device — pick one from the list."

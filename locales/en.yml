en:
  theme_metadata:
    description: "Adds an accessible 'Listen' button to posts using the browser's built-in text-to-speech (Web Speech API). No external services, no API keys."
    settings:
      default_rate: "Default playback speed (1 = normal)."
      default_voice: "Preferred voice language (the player tries this first)."
      voice_macos: "Recommended voice name for Apple macOS visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_ios: "Recommended voice name for Apple iPhone visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_ipados: "Recommended voice name for Apple iPad visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_windows: "Recommended voice name for Windows visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_android: "Recommended voice name for Android visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_chromeos: "Recommended voice name for ChromeOS visitors, picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_chrome_desktop: "Recommended voice name for Chrome desktop visitors (Google voices), picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      voice_edge: "Recommended voice name for Edge visitors (Microsoft Online voices), picked from the curated list. 'auto' lets the component choose; a name overrides it only when its language matches the one spoken. Ignored on other platforms."
      show_voice_selector: "Let users pick from the voices installed on their device."
      skip_code_blocks: "Don't read code blocks aloud."
      skip_quotes: "Don't read quoted content aloud."
      show_unsupported_notice: "Show a short notice on posts when the visitor's browser has no text-to-speech support (otherwise the button is simply hidden)."
      show_no_voice_notice: "Show a small red notice when no installed voice speaks the configured language, and let the visitor pick one from the drop-down (otherwise the player just stays idle)."
  tts_listen:
    group_label: "Listen to this post"
    listen: "Listen"
    pause: "Pause"
    resume: "Resume"
    stop: "Stop"
    speed: "Speed"
    default_speed: "Default"
    voice: "Voice"
    default_voice_option: "Default (admin)"
    unsupported: "Text-to-speech isn't supported by this browser."
    playing: "Reading post aloud…"
    paused: "Paused"
    finished: "Finished reading"
    failed: "Text-to-speech failed."
    empty: "Nothing readable in this post."
    no_voice: "No voice for %{language} is installed on this device — pick one from the list."

de:
  theme_metadata:
    description: "Fügt Beiträgen eine barrierefreie Schaltfläche „Anhören“ hinzu, die den Inhalt mit der integrierten Text-to-Speech-Funktion des Browsers (Web Speech API) vorliest. Keine externen Dienste, keine API-Schlüssel."
    settings:
      default_rate: "Standard-Abspielgeschwindigkeit (1 = normal)."
      default_voice: „Bevorzugte Stimmen-Sprache (der Player versucht diese zuerst).“
      voice_macos: „Empfohlener Stimmenname für Besucher auf Apple macOS, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_ios: „Empfohlener Stimmenname für Besucher auf Apple iPhone, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_ipados: „Empfohlener Stimmenname für Besucher auf Apple iPad, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_windows: „Empfohlener Stimmenname für Besucher auf Windows, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_android: „Empfohlener Stimmenname für Besucher auf Android, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_chromeos: „Empfohlener Stimmenname für Besucher auf ChromeOS, aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_chrome_desktop: „Empfohlener Stimmenname für Besucher auf Chrome am Desktop (Google-Stimmen), aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      voice_edge: „Empfohlener Stimmenname für Besucher auf Edge (Microsoft-Online-Stimmen), aus der kuratierten Liste. ‚auto‘ lässt die Komponente wählen; ein Name setzt das nur außer Kraft, wenn seine Sprache mit der gesprochenen übereinstimmt. Auf anderen Plattformen ignoriert."
      show_voice_selector: "Besuchern erlauben, aus den auf ihrem Gerät installierten Stimmen zu wählen."
      skip_code_blocks: "Codeblöcke nicht vorlesen."
      skip_quotes: "Zitierte Inhalte nicht vorlesen."
      show_unsupported_notice: „Einen kurzen Hinweis auf Beiträgen anzeigen, wenn der Browser des Besuchers keine Text-to-Speech-Funktion unterstützt (andernfalls wird die Schaltfläche einfach ausgeblendet).“
      show_no_voice_notice: „Einen kleinen roten Hinweis anzeigen, wenn keine installierte Stimme die konfigurierte Sprache spricht, und die Besucherin eine Stimme aus der Liste wählen lassen (andernfalls bleibt der Player einfach inaktiv).“
  tts_listen:
    group_label: "Diesen Beitrag anhören"
    listen: "Anhören"
    pause: "Pause"
    resume: "Fortsetzen"
    stop: "Stopp"
    speed: "Geschwindigkeit"
    default_speed: "Standard"
    voice: "Stimme"
    default_voice_option: "Standard (Admin)"
    unsupported: "Text-to-Speech wird von diesem Browser nicht unterstützt."
    playing: "Beitrag wird vorgelesen…"
    paused: "Pausiert"
    finished: "Vorlesen beendet"
    failed: „Text-to-Speech ist fehlgeschlagen.“
    empty: „In diesem Beitrag gibt es nichts Vorzulesendes.“
    no_voice: „Für %{language} ist keine Stimme auf diesem Gerät installiert — wähle eine aus der Liste.“

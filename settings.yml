# Theme settings for the TTS Listen component.
#
# Voice-name enums below are DERIVED from the vendored recommended-voice
# index (javascripts/discourse/lib/tts-recommended-voices.js). When the
# index is refreshed (see docs/research/0002-refresh-recommended-voices.md),
# regenerate these choice lists with scripts/build-voice-choices.mjs so the
# admin drop-downs stay in sync with the index a visitor is matched against.

default_rate:
  type: float
  default: 1
  min: 0.1
  max: 2.0

default_voice:
  type: enum
  default: auto
  choices:
    - auto
    - de
    - de-AT
    - de-CH
    - de-DE
    - en
    - en-AU
    - en-CA
    - en-GB
    - en-IN
    - en-US
    - fr
    - fr-CA
    - fr-FR
    - es
    - es-419
    - es-ES
    - es-MX
    - it
    - it-IT
    - pt
    - pt-BR
    - pt-PT
    - nl
    - nl-NL
    - ru
    - pl
    - tr
    - sv
    - da
    - nb
    - fi
    - el
    - cs
    - hu
    - ro
    - uk
    - bg
    - hr
    - sk
    - sl
    - sr
    - he
    - ar
    - hi
    - ur
    - fa
    - th
    - vi
    - id
    - ms
    - ja
    - ko
    - zh-CN
    - zh-TW
    - ca
    - et
    - lt
    - lv
    - sq
    - sw
    - gl
    - eu

# Per-platform recommended voice NAME, pinned from the vendored index.
# `auto` means: let the component pick the best installed voice for the
# resolved language on this platform (ADR 0008). A specific name overrides
# that pick, but only when the name's language family matches the resolved
# language (the admin's default_voice, or the site language under `auto`);
# a pinned name whose language does not match is ignored so a visitor never
# hears the wrong language. See ADR 0009. Choices are lang-prefixed
# ("<lang>: <name>") so the admin can tell languages apart in one flat list.

